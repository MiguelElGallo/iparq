name: Python check

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - ".azdo/**"
      - ".devcontainer/**"
      - ".github/**"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - ".azdo/**"
      - ".devcontainer/**"
      - ".github/**"
  workflow_call:

jobs:
  test_package:
    permissions:
        contents: read
    name: Test ${{ matrix.os }} Python ${{ matrix.python_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python_version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      UV_SYSTEM_PYTHON: 1
      UV_PYTHON: ${{ matrix.python_version }}
    steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - name: Setup python
          uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
          with:
            python-version: ${{ matrix.python_version }}
            architecture: x64
        - name: Install uv
          uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

        # dependencies are in uv.lock
        - name: Install dependencies
          run: |
            uv sync --all-extras --locked

        - name: Lint with ruff
          run: uv run ruff check .
        - name: Check types with mypy
          run: uv run mypy src/iparq --config-file=pyproject.toml
        - name: Check types with ty
          run: uv run ty check
        - name: Check formatting with ruff
          run: uv run ruff format --check .
        - name: Run Python tests
          run: uv run pytest -vv
