# Dispatch this workflow at a version-matched release tag to publish to PyPI.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  workflow_dispatch

permissions:
  contents: read

jobs:
  test-and-validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Sync locked dependencies
        run: uv sync --all-extras --locked

      - name: Verify release tag and package versions
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from importlib.metadata import version
          from iparq import __version__

          package_version = version("iparq")
          expected_ref = f"refs/tags/v{package_version}"
          assert os.environ["RELEASE_REF"] == expected_ref, (
              f"Dispatch at {expected_ref}, got {os.environ['RELEASE_REF']}"
          )
          assert __version__ == package_version, "Package versions disagree"
          print(f"Validated {expected_ref}")
          PY

      - name: Run all Python quality gates
        env:
          PYTEST_ADDOPTS: --cov=src/iparq --cov-report=html
        run: uv run --no-sync python -m scripts.quality all

      - name: Run type checking
        run: uv run --no-sync mypy src/iparq --config-file=pyproject.toml

      - name: Run ty
        run: uv run --no-sync ty check

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: |
            .coverage
            htmlcov/

  release-build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: test-and-validate

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Sync locked dependencies
        run: uv sync --all-extras --locked

      - name: Build release distributions
        run: |
          uv build

      - name: Test the built wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/iparq-release-smoke"
          source "$RUNNER_TEMP/iparq-release-smoke/bin/activate"
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import os
          from importlib.metadata import version
          from pathlib import Path
          import iparq

          assert Path(iparq.__file__).resolve().is_relative_to(
              Path(os.environ["VIRTUAL_ENV"]).resolve()
          ), "Smoke test imported the source checkout"
          assert iparq.__version__ == version("iparq")
          assert os.environ["GITHUB_REF"] == f"refs/tags/v{iparq.__version__}"
          print(f"Installed iParq {iparq.__version__} from the release wheel")
          PY
          iparq --help
          iparq inspect "$GITHUB_WORKSPACE/tests/dummy.parquet" --format json | python -m json.tool > /dev/null
          if iparq inspect "$RUNNER_TEMP/does-not-exist.parquet"; then
            echo "Missing files must return a non-zero exit code"
            exit 1
          fi
          deactivate

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - test-and-validate
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      url: https://pypi.org/project/iparq/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        # v1.14.2, pinned to its peeled commit and matching GHCR image tag.
        # This release supports distributions using Core Metadata 2.5.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
