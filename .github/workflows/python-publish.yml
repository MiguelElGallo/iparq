# Dispatch this workflow at a version-matched release tag to publish to PyPI.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  workflow_dispatch

permissions:
  contents: read

jobs:
  test-and-validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: "Set up Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Sync locked dependencies
        run: uv sync --all-extras --locked

      - name: Verify release tag and package versions
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from importlib.metadata import version
          from iparq import __version__

          package_version = version("iparq")
          expected_ref = f"refs/tags/v{package_version}"
          assert os.environ["RELEASE_REF"] == expected_ref, (
              f"Dispatch at {expected_ref}, got {os.environ['RELEASE_REF']}"
          )
          assert __version__ == package_version, "Package versions disagree"
          print(f"Validated {expected_ref}")
          PY

      - name: Run all Python quality gates
        env:
          PYTEST_ADDOPTS: --cov=src/iparq --cov-report=html
        run: uv run --no-sync python -m scripts.quality all

      - name: Run type checking
        run: uv run --no-sync mypy src/iparq --config-file=pyproject.toml

      - name: Run ty
        run: uv run --no-sync ty check

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: |
            .coverage
            htmlcov/

  release-build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: test-and-validate

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: "Set up Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Sync locked dependencies
        run: uv sync --all-extras --locked

      - name: Build release distributions
        run: |
          uv build

      - name: Test the built wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/iparq-release-smoke"
          source "$RUNNER_TEMP/iparq-release-smoke/bin/activate"
          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          python -m pip install "${wheels[0]}"
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import os
          from importlib.metadata import version
          from pathlib import Path
          import iparq

          assert Path(iparq.__file__).resolve().is_relative_to(
              Path(os.environ["VIRTUAL_ENV"]).resolve()
          ), "Smoke test imported the source checkout"
          assert iparq.__version__ == version("iparq")
          assert os.environ["GITHUB_REF"] == f"refs/tags/v{iparq.__version__}"
          print(f"Installed iParq {iparq.__version__} from the release wheel")
          PY
          iparq --help
          iparq inspect "$GITHUB_WORKSPACE/tests/dummy.parquet" --format json | python -m json.tool > /dev/null
          if iparq inspect "$RUNNER_TEMP/does-not-exist.parquet"; then
            echo "Missing files must return a non-zero exit code"
            exit 1
          fi
          python -m pip install "${wheels[0]}[vortex]"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          import vortex as vx

          path = Path("release-smoke.vortex")
          vx.io.write(vx.array([{"id": 1}, {"id": 2}]), str(path))
          parquet = Path(os.environ["GITHUB_WORKSPACE"]) / "tests" / "dummy.parquet"
          reports = json.loads(subprocess.check_output(
              ["iparq", "inspect", str(path), str(parquet), "--format", "json"]
          ))
          assert len(reports) == 2
          assert reports[0]["metadata"]["file_format"] == "vortex"
          assert reports[0]["metadata"]["num_rows"] == 2
          assert reports[0]["columns"][0]["column_name"] == "id"
          assert reports[1]["metadata"]["num_rows"] == 3
          PY
          deactivate

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - test-and-validate
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      url: https://pypi.org/project/iparq/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        # v1.14.3, pinned to its peeled commit and matching GHCR image tag.
        # This release supports distributions using Core Metadata 2.5.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
